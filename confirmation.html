<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Commande envoyée - Cheap'Meal</title>
<style>
:root{--bg:#0b0b10;--card:#17171f;--line:#2b2b36;--yellow:#ffcc00;--orange:#ff4d00;--discord:#5865F2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top left,rgba(255,204,0,.14),transparent 30%),radial-gradient(circle at top right,rgba(255,77,0,.12),transparent 35%),var(--bg);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:560px;width:100%;background:rgba(23,23,31,.96);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 18px 45px rgba(0,0,0,.35);text-align:center}
.icon{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--yellow),var(--orange));color:#111;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;margin:0 auto 16px}
h1{margin:0 0 10px;font-size:30px}
p{color:#c9c9d3;line-height:1.6}
.box{background:#111118;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;margin:18px 0}
.box strong{color:var(--yellow)}
.btn{display:block;width:100%;padding:15px;border-radius:15px;text-decoration:none;font-weight:900;margin-top:12px}
.discord{background:var(--discord);color:white}
.back{background:white;color:#111}
</style>
</head>
<body>
<div class="card">
<div class="icon">✓</div>
<h1>Commande envoyée</h1>
<p>Ta commande a bien été transmise. Maintenant, paie le montant exact sur PayPal avec le code commande indiqué sur la page précédente.</p>
<div class="box">
<strong>Après paiement :</strong><br>
Retourne dans ton ticket Discord et envoie ta preuve de paiement avec ton code commande.
</div>
<a class="btn discord" href="https://discord.gg/hHFfjjC4rs">Retourner sur Discord</a>
<a class="btn back" href="https://timm647.github.io/cheapmeal/">Revenir au site</a>
</div>
</body>
</html>
